name: CI & Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: venom-tempmail-bot/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Syntax & Unit Verification
        run: node -e "import('./src/services/otpExtractor.js'); import('./src/services/mailService.js'); console.log('✅ All modules imported successfully!');"
